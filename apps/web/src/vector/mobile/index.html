<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Fragment X on mobile</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#1e1f22" />
        <style>
            :root {
                color-scheme: dark;
            }
            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #1e1f22;
                color: #dbdee1;
                font-family:
                    Inter,
                    system-ui,
                    -apple-system,
                    "Segoe UI",
                    sans-serif;
            }
            main {
                box-sizing: border-box;
                width: 100%;
                max-width: 420px;
                padding: 24px 16px;
            }
            h1 {
                margin: 0 0 8px;
                font-size: 28px;
            }
            p {
                margin: 0 0 16px;
                line-height: 1.5;
                color: #b5bac1;
            }
            a.open {
                display: block;
                padding: 14px 16px;
                border-radius: 8px;
                background: #7c6cf0;
                color: #fff;
                font-weight: 600;
                text-align: center;
                text-decoration: none;
            }
            a.open:active {
                background: #6d5ce0;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>Fragment X</h1>
            <p>Fragment X runs in your phone's browser. There is nothing to install.</p>
            <a class="open" href="./">Open Fragment X</a>
            <p></p>
            <p>To keep it on your home screen, use Add to Home Screen in your browser's share or menu.</p>
        </main>
    </body>
</html>
